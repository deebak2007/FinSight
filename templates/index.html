<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinSight — Personal Finance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #1e1e2e;
    --accent: #7c6af7;
    --accent2: #f7c26a;
    --text: #e8e8f0;
    --muted: #888899;
    --green: #4ade80;
    --red: #f87171;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 { background: rgba(124,106,247,0.15); top: -200px; left: -100px; }
  .glow-2 { background: rgba(247,194,106,0.08); bottom: -200px; right: -100px; }

  .container { max-width: 480px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }

  /* Header */
  .brand {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--muted); font-size: 15px; font-weight: 300; }

  /* Auth card */
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
    animation: fadeUp 0.6s ease 0.2s both;
    box-shadow: 0 0 60px rgba(124,106,247,0.05);
  }

  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    transition: all 0.2s;
    border: none;
    background: none;
  }
  .tab.active {
    background: var(--accent);
    color: white;
  }

  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #333345; }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #9b8cf9);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.5px;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }

  .error {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--red);
    font-size: 14px;
    margin-top: 12px;
    display: none;
  }

  /* Features strip */
  .features {
    display: flex;
    gap: 12px;
    margin-top: 32px;
    animation: fadeUp 0.6s ease 0.4s both;
  }
  .feature {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
  }
  .feature .icon { font-size: 22px; margin-bottom: 6px; }
  .feature .ftxt {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.3;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="container">
  <div class="brand">
    <div class="logo">
      <div class="logo-icon">💎</div>
      <span class="logo-text">FinSight</span>
    </div>
    <p class="tagline">Your intelligent personal finance assistant</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="login()" id="loginBtn">Sign In</button>
      <div class="error" id="loginError"></div>
    </div>

    <!-- Register -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="yourname" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min. 6 characters" />
      </div>
      <button class="btn" onclick="register()" id="registerBtn">Create Account</button>
      <div class="error" id="registerError"></div>
    </div>
  </div>

  <div class="features">
    <div class="feature"><div class="icon">📊</div><div class="ftxt">Smart Dashboard</div></div>
    <div class="feature"><div class="icon">🔮</div><div class="ftxt">Predictions</div></div>
    <div class="feature"><div class="icon">💰</div><div class="ftxt">Budget Alerts</div></div>
    <div class="feature"><div class="icon">📈</div><div class="ftxt">Insights</div></div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='login')));
  document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
}

async function login() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  btn.disabled = true;

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    })
  });
  const data = await res.json();
  if (res.ok) { window.location.href = '/dashboard'; }
  else {
    err.textContent = data.error;
    err.style.display = 'block';
    btn.innerHTML = 'Sign In';
    btn.disabled = false;
  }
}

async function register() {
  const btn = document.getElementById('registerBtn');
  const err = document.getElementById('registerError');
  err.style.display = 'none';
  btn.innerHTML = '<span class="spinner"></span>Creating...';
  btn.disabled = true;

  const res = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      username: document.getElementById('regUsername').value,
      email: document.getElementById('regEmail').value,
      password: document.getElementById('regPassword').value
    })
  });
  const data = await res.json();
  if (res.ok) { window.location.href = '/dashboard'; }
  else {
    err.textContent = data.error;
    err.style.display = 'block';
    btn.innerHTML = 'Create Account';
    btn.disabled = false;
  }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!document.getElementById('loginForm').classList.contains('hidden')) login();
    else register();
  }
});
</script>
</body>
</html>
